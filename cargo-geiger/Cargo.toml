[package]
authors = ["anderejd <rajder@gmail.com>"]
categories = ["command-line-utilities", "development-tools", "development-tools::cargo-plugins", "parsing"]
description = "Detects usage of unsafe Rust in a Rust crate and its dependencies."
edition = "2018"
keywords = ["unsafe", "cargo", "plugin"]
license = "Apache-2.0 OR MIT"
name = "cargo-geiger"
readme = "README.md"
repository = "https://github.com/rust-secure-code/cargo-geiger"
version = "0.14.0"
rust-version = "1.85"

[badges]
maintenance = { status = "experimental" }

[dependencies]
anyhow = "1.0.100"
cargo = "0.86.0"
cargo-geiger-serde = { path = "../cargo-geiger-serde", version = "0.3.0" }
cargo-platform = "0.1.9"
colored = "3.1.1"
console = "0.15.11"
geiger = { path = "../geiger", version = "0.5.0" }
krates = { version = "0.18.1", features = ["metadata"] }
petgraph = "0.7.1"
pico-args = "0.5.0"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = "0.27.2"
strum_macros = "0.27.2"
walkdir = "2.5.0"
url = "2.5.8"
cargo-util = "0.2.20"

[features]
vendored-openssl = ["cargo/vendored-openssl"]

[dev-dependencies]
assert_cmd = "2.1.2"
better-panic = "0.3.0"
fs_extra = "1.3.0"
insta = "1.46.1"
rand = "0.9.2"
regex = "1.12.2"
rstest = "0.26.1"
semver = "1.0.27"
tempfile = "3.24.0"
